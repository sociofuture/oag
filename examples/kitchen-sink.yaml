openapi: 3.0.3
info:
  title: Kitchen Sink
  description: A sample that uses most OpenAPI features, for comparing the generated code with openapi-generator.
  version: 2.1.0
  contact:
    email: team@example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:8080/v2
tags:
  - name: pet
    description: Everything about pets
  - name: store
    description: Access to the store
paths:
  /pets:
    get:
      tags: [pet]
      summary: List pets
      description: Returns a page of pets, filtered by the query parameters.
      operationId: listPets
      parameters:
        - name: status
          in: query
          description: Status values to filter by
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [available, pending, sold]
        - name: limit
          in: query
          description: Maximum number of items
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: birthday
          in: query
          schema:
            type: string
            format: date
        - name: X-Trace-Id
          in: header
          description: Trace id
          schema:
            type: string
      responses:
        '200':
          description: A page of pets
          headers:
            X-Total-Count:
              description: Total number of pets
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [pet]
      summary: Add a new pet
      operationId: addPet
      security:
        - petstore_auth: ['write:pets', 'read:pets']
      requestBody:
        description: Pet to add
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
          application/xml:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid input
        '405':
          description: Method not allowed
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        description: ID of the pet
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [pet]
      summary: Find pet by ID
      operationId: getPetById
      parameters:
        - name: verbose
          in: query
          schema:
            type: boolean
        - name: session
          in: cookie
          schema:
            type: string
      security:
        - api_key: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found
    put:
      tags: [pet]
      summary: Update a pet
      operationId: updatePet
      security:
        - basic_auth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    delete:
      tags: [pet]
      summary: Deletes a pet
      operationId: deletePet
      parameters:
        - name: api_key
          in: header
          required: false
          schema:
            type: string
      security:
        - petstore_auth: ['write:pets']
      responses:
        '204':
          description: Deleted
        '400':
          description: Invalid pet value
  /pets/{petId}/uploadImage:
    post:
      tags: [pet]
      summary: Uploads an image
      operationId: uploadFile
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                additionalMetadata:
                  description: Additional data to pass to server
                  type: string
                file:
                  description: file to upload
                  type: string
                  format: binary
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /pets/{petId}/photo:
    get:
      tags: [pet]
      summary: Download the photo
      operationId: getPhoto
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The photo
          content:
            image/png:
              schema:
                type: string
                format: binary
  /pets/form:
    post:
      tags: [pet]
      summary: Updates a pet with form data
      operationId: updatePetWithForm
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  description: Updated name of the pet
                  type: string
                status:
                  description: Updated status of the pet
                  type: string
      responses:
        '405':
          description: Invalid input
  /pets/bulk:
    post:
      tags: [pet]
      summary: Add many pets
      operationId: addPets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: The added pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
  /store/inventory:
    get:
      tags: [store]
      summary: Returns pet inventories by status
      operationId: getInventory
      security:
        - api_key: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
  /store/order:
    post:
      tags: [store]
      summary: Place an order
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /ping:
    get:
      summary: Health check
      operationId: ping
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    petstore_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://example.com/oauth/authorize
          scopes:
            write:pets: modify pets
            read:pets: read pets
    api_key:
      type: apiKey
      name: X-API-Key
      in: header
    basic_auth:
      type: http
      scheme: basic
  schemas:
    Status:
      description: Status of a pet
      type: string
      enum: [available, pending, sold]
    Priority:
      type: integer
      enum: [1, 2, 3]
    Category:
      description: A pet category
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 50
    Tag:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Pet:
      description: A pet for sale in the pet store
      type: object
      required: [name, photoUrls]
      properties:
        id:
          type: integer
          format: int64
          description: Unique id
          example: 10
        category:
          $ref: '#/components/schemas/Category'
        name:
          type: string
          example: doggie
        photoUrls:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          description: pet status in the store
          enum: [available, pending, sold]
          default: available
        state:
          $ref: '#/components/schemas/Status'
        priority:
          $ref: '#/components/schemas/Priority'
        birthday:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        nickname:
          type: string
          nullable: true
        weight:
          type: number
          format: double
          minimum: 0
        email:
          type: string
          format: email
        homepage:
          type: string
          format: uri
        guid:
          type: string
          format: uuid
        attributes:
          type: object
          additionalProperties:
            type: string
        scores:
          type: array
          uniqueItems: true
          items:
            type: integer
        history:
          type: array
          items:
            type: string
            format: date-time
        owner:
          $ref: '#/components/schemas/Owner'
    Dog:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          required: [breed]
          properties:
            breed:
              type: string
            bark:
              type: boolean
    Owner:
      type: object
      properties:
        name:
          type: string
        pets:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        address:
          type: object
          properties:
            street:
              type: string
            zip:
              type: string
              pattern: '^[0-9]{3}-[0-9]{4}$'
    Order:
      type: object
      required: [petId]
      properties:
        id:
          type: integer
          format: int64
        petId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        shipDate:
          type: string
          format: date-time
        complete:
          type: boolean
          default: false
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
